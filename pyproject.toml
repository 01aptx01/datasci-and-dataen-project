[project]
name = "datasci-and-dataen-project"
version = "0.1.0"
description = "Asset volatility forecasting and portfolio risk pipeline"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "yfinance>=1.8.0, <1.9.0",
    "pandas>=2.2.0, <2.3.0",
    "pandas-market-calendars>=5.0.0, <6.0.0",
    "pyarrow",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0, <8.4.0",
    "nbclient>=0.10, <0.11",
    "nbformat>=5.10, <6",
]
eda = [
    "numpy>=2.0, <2.3",
    "matplotlib>=3.9, <3.11",
    "ipykernel>=6.29, <7",
    "jupyterlab>=4.3, <5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

