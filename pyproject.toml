[project]
name = "datasci-and-dataen-project"
version = "0.1.0"
description = "Asset volatility forecasting and portfolio risk pipeline"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "yfinance>=1.8.0, <1.9.0",
    "pandas>=2.2.0, <2.3.0",
    "pandas-market-calendars>=5.0.0, <6.0.0",
    "pyarrow",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

