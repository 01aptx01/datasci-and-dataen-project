config_version: "1.0.0"
market: XNYS
data_cutoff: "2026-09-25"
core_features:
  - ret_1d_t
  - ret_lag_1d
  - ret_lag_2d
  - ret_trailing_5d
  - ret_trailing_20d
  - rv_5d
  - rv_20d
  - rv_60d
splits:
  train:
    start_date: "2021-09-27"
    end_date: "2024-09-30"
  validation:
    start_date: "2024-10-01"
    end_date: "2025-09-30"
  test:
    start_date: "2025-10-01"
    end_date: "2026-09-25"
replay:
  availability_rule: "is_label_mature and target_obs_count == 5 and target_end_date <= replay_date"
  strict_point_in_time_source_verification: false
  fixed_split_purge_rule: "target_end_date >= next_split_start_date"
